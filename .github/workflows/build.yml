name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build app source (PR validation and release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Android project files
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/vn/scamshield/MainActivity.kt
          test -f app/src/main/java/vn/scamshield/Screens.kt
          test -f app/src/main/java/vn/scamshield/Theme.kt
          grep -q "lightColorScheme" app/src/main/java/vn/scamshield/MainActivity.kt
          grep -q "beginProtectionSetup" app/src/main/java/vn/scamshield/MainActivity.kt

      - name: Build APK from repository source
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)"/\1/')
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/ScamShield.apk
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScamShield-${{ steps.package.outputs.version }}-debug-apk
          path: dist/ScamShield.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ScamShield v${{ steps.package.outputs.version }}
          body: |
            APK được build trực tiếp từ mã nguồn nhánh main của repository.
            Đây là bản debug để cài đặt và kiểm thử.
          files: dist/ScamShield.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
