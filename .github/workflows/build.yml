name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giải nén (kể cả zip lồng nhau)
        run: |
          mkdir -p src
          unzip -oq ScamShield.zip -d src
          for i in 1 2 3; do
            find src -name '*.zip' | while read -r z; do
              d="${z%.zip}_unz"
              [ -d "$d" ] || unzip -oq "$z" -d "$d"
            done
          done
          echo "--- Cấu trúc sau khi giải nén ---"
          find src -maxdepth 4 | head -40
      - name: Tìm thư mục dự án
        id: find
        run: |
          f=$(find src -name settings.gradle.kts | head -1)
          if [ -z "$f" ]; then echo "KHÔNG tìm thấy settings.gradle.kts trong zip"; exit 1; fi
          echo "dir=$GITHUB_WORKSPACE/$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Khôi phục chatbot nổi trong bản APK
        run: |
          cp "$GITHUB_WORKSPACE/app/src/main/java/vn/scamshield/Chatbot.kt" app/src/main/java/vn/scamshield/Chatbot.kt
          cp "$GITHUB_WORKSPACE/app/src/main/java/vn/scamshield/FamilyChat.kt" app/src/main/java/vn/scamshield/FamilyChat.kt
          python3 "$GITHUB_WORKSPACE/scripts/restore_chatbot.py" app/src/main/java/vn/scamshield/Screens.kt
        working-directory: ${{ steps.find.outputs.dir }}
      - name: Build APK
        run: gradle assembleDebug --no-daemon
        working-directory: ${{ steps.find.outputs.dir }}
      - name: Prepare stable download file
        id: package
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)"/\1/')
          if [ -z "$VERSION_NAME" ]; then echo "Could not read app versionName"; exit 1; fi
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "APK output not found"; exit 1; fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/ScamShield.apk"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
        working-directory: ${{ steps.find.outputs.dir }}
      - uses: actions/upload-artifact@v4
        with:
          name: ScamShield-debug-apk
          path: dist/ScamShield.apk
      - name: Publish latest APK download
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ScamShield v${{ steps.package.outputs.version }}
          body: |
            Bản cài đặt Android mới nhất của ScamShield.
            Tải file ScamShield.apk hoặc quét mã QR tải ứng dụng.
            Lưu ý: đây là APK cài đặt trực tiếp, Android sẽ yêu cầu người dùng xác nhận trước khi cài.
          files: dist/ScamShield.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
